name: Собрать Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Проверка и сборка APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Скачать исходный код
        uses: actions/checkout@v5

      - name: Установить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Установить Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The GitHub-hosted Ubuntu image already includes the Android SDK and licenses.
      - name: Проверить Android SDK 35
        shell: bash
        run: |
          if [[ ! -f "${ANDROID_HOME:-}/platforms/android-35/android.jar" ]]; then
            echo "::error::Android SDK platform 35 was not found in ANDROID_HOME"
            exit 1
          fi

      - name: Установить зависимости
        run: npm ci

      - name: Проверить расчёты
        run: npm test

      - name: Собрать сайт и скопировать его в Android-проект
        run: npm run android:sync

      - name: Подготовить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Собрать установочный APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            details=$(grep -E 'FAILURE:|What went wrong|Could not|Caused by:|error:' "$RUNNER_TEMP/gradle-build.log" | tail -n 15 | tr '\n' ' ' || true)
            echo "::error::Gradle build failed. ${details:-See the build log for details.}"
            exit "$result"
          fi

      - name: Подготовить файл для скачивания
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pyaterka-debug.apk

      - name: Сохранить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Pyaterka-APK
          path: pyaterka-debug.apk
          if-no-files-found: error
          retention-days: 30
