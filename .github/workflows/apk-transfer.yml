name: Подготовить прямое скачивание APK

on:
  push:
    branches:
      - arena/db1019af-mark-kalkylyator

permissions:
  actions: read
  contents: write

jobs:
  transfer-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Передать собранный APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-transfer"
          if ! gh run download 45962559350 --name Pyaterka-APK --dir "$RUNNER_TEMP/apk-transfer" > "$RUNNER_TEMP/apk-download.log" 2>&1; then
            echo '::error::Could not download the completed APK artifact.'
            exit 1
          fi
          export APK_PATH="$RUNNER_TEMP/apk-transfer/pyaterka-debug.apk"
          export BLOB_REQUEST="$RUNNER_TEMP/apk-blob.json"
          test -s "$APK_PATH"
          python3 - <<'PY'
          import base64, json, os
          with open(os.environ['APK_PATH'], 'rb') as source:
              content = base64.b64encode(source.read()).decode('ascii')
          with open(os.environ['BLOB_REQUEST'], 'w', encoding='utf-8') as target:
              json.dump({'content': content, 'encoding': 'base64'}, target)
          PY
          if ! blob=$(gh api --method POST "repos/$GH_REPO/git/blobs" --input "$BLOB_REQUEST" --jq .sha 2> "$RUNNER_TEMP/apk-upload.log"); then
            echo '::error::Could not temporarily transfer the APK to the workspace.'
            exit 1
          fi
          sha256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          echo "::notice title=APK transfer::blob=$blob sha256=$sha256"
